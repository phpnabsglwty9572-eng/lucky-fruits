workflows:
  ios-native-unsigned:
    name: Lucky Fruits iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: LuckyFruits.xcodeproj
        XCODE_SCHEME: LuckyFruits
        BUNDLE_ID: com.luckyfruit.lotharm
    scripts:
      - name: Build iOS without code signing
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-app-store:
    name: Lucky Fruits App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: lucky-fruits
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.luckyfruit.lotharm
      vars:
        XCODE_PROJECT: LuckyFruits.xcodeproj
        XCODE_SCHEME: LuckyFruits
        BUNDLE_ID: com.luckyfruit.lotharm
      xcode: latest
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - valentinlastinger@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
