workflows:
  ios-native-unsigned:
    name: Lucky Fruits iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: LuckyFruits.xcodeproj
        XCODE_SCHEME: LuckyFruits
        BUNDLE_ID: com.luckyfruit.lotharm
    scripts:
      - name: Build iOS without code signing
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
